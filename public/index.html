<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d0f" />
  <title>Red Music</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-64.png" />
  <style>
    :root {
      --bg: #0d0d0f;
      --panel: #16161a;
      --red: #e02234;
      --text: #f2f2f5;
      --muted: #9a9aa3;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 360px;
      width: 100%;
      background: var(--panel);
      border-radius: 20px;
      padding: 36px 28px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      margin: 0 auto 20px;
      display: block;
    }
    h1 { font-size: 22px; margin-bottom: 6px; }
    h1 span { color: var(--red); }
    p { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .spinner {
      width: 34px;
      height: 34px;
      margin: 22px auto 0;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .offline { display: none; }
    .offline.show { display: block; }
    .loading.hide { display: none; }
    button {
      margin-top: 22px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 26px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="logo.png" alt="Red Music" onerror="this.style.display='none'" />
    <h1><span>Red</span> Music</h1>

    <div class="loading" id="loading">
      <p>Загрузка приложения…</p>
      <div class="spinner"></div>
    </div>

    <div class="offline" id="offline">
      <p>Нет интернета.<br />Проверьте подключение и попробуйте снова.</p>
      <button onclick="tryLoad()">Повторить</button>
    </div>
  </div>

  <script>
    var APP_URL = "https://red-music.onrender.com";
    var loadingEl = document.getElementById("loading");
    var offlineEl = document.getElementById("offline");

    function showOffline() {
      loadingEl.classList.add("hide");
      offlineEl.classList.add("show");
    }

    function showLoading() {
      offlineEl.classList.remove("show");
      loadingEl.classList.remove("hide");
    }

    function tryLoad() {
      showLoading();
      if (!navigator.onLine) {
        setTimeout(showOffline, 400);
        return;
      }
      // Проверяем доступность сервера, затем переходим
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, 8000);
      fetch(APP_URL + "/health", { signal: controller.signal, cache: "no-store" })
        .then(function () {
          clearTimeout(timer);
          window.location.replace(APP_URL);
        })
        .catch(function () {
          clearTimeout(timer);
          // Сервер мог «спать» (бесплатный Render) — пробуем перейти напрямую
          if (navigator.onLine) {
            window.location.replace(APP_URL);
          } else {
            showOffline();
          }
        });
    }

    window.addEventListener("online", tryLoad);
    tryLoad();
  </script>
</body>
</html>
