services:
  - type: web
    name: red-music
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: STORAGE_DIR
        value: /opt/render/project/src/storage
    # База — файл SQLite (storage/data/red-music.db), музыка — storage/uploads/.
    # Бесплатный план Render использует эфемерный диск: всё, что не на
    # Persistent Disk, стирается при каждом деплое/рестарте. Чтобы аккаунты
    # и музыка сохранялись постоянно, подключите платный Persistent Disk
    # (ниже) — тогда и БД, и файлы переживут любой деплой.
    disk:
      name: red-music-storage
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
