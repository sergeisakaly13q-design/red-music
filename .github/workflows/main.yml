name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Собрать APK
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Установить Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить зависимости
        run: npm install

      - name: Установить Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Создать Capacitor проект
        run: |
          if [ ! -f capacitor.config.json ]; then
            npx cap init "Red Music" "com.redmusic.app" --web-dir public
          fi

      - name: Создать Android проект
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Скопировать приложение в Android
        run: npx cap copy android

      - name: Собрать APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
