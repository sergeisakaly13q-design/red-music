name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 1

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Проверить большие аудиофайлы
        run: |
          echo "Аудиофайлы, попавшие в checkout:"
          find . -type f \( -iname "*.mp3" -o -iname "*.wav" -o -iname "*.ogg" -o -iname "*.m4a" -o -iname "*.flac" \) -not -path "./node_modules/*" -not -path "./.git/*" | head -100 || true

      - name: Установить зависимости
        run: npm install --no-audit --no-fund

      - name: Добавить Android платформу
        run: |
          # android/ никогда не хранится в git — генерируем с нуля
          # каждый раз, чтобы всегда получать полный проект с gradlew.
          rm -rf android
          npx cap add android

      - name: Наложить кастомный MediaSession-код
        run: |
          mkdir -p android/app/src/main/java/com/redmusic/app
          cp android-overlay/java/com/redmusic/app/MainActivity.kt \
             android/app/src/main/java/com/redmusic/app/MainActivity.kt
          cp android-overlay/java/com/redmusic/app/RedMusicMediaPlugin.kt \
             android/app/src/main/java/com/redmusic/app/RedMusicMediaPlugin.kt
          cp android-overlay/java/com/redmusic/app/RedMusicMediaService.kt \
             android/app/src/main/java/com/redmusic/app/RedMusicMediaService.kt

          mkdir -p android/app/src/main/res/drawable
          cp android-overlay/res/drawable/ic_music_notification.xml \
             android/app/src/main/res/drawable/ic_music_notification.xml

          echo "Кастомные файлы скопированы."

      - name: Патч AndroidManifest.xml для MediaSession
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          marker = "<!-- RED_MUSIC_MEDIA_SESSION -->"

          if marker not in text:
              permissions = (
                  marker + "\n"
                  '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n'
                  '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n'
              )
              text = re.sub(r'(<manifest[^>]*>)', r'\1\n' + permissions, text, count=1)

              service_block = (
                  '        <service\n'
                  '            android:name=".RedMusicMediaService"\n'
                  '            android:exported="false"\n'
                  '            android:foregroundServiceType="mediaPlayback">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.MEDIA_BUTTON" />\n'
                  '            </intent-filter>\n'
                  '        </service>\n'
              )
              text = text.replace("</application>", service_block + "    </application>", 1)

              p.write_text(text)
              print("AndroidManifest.xml пропатчен")
          else:
              print("AndroidManifest.xml уже пропатчен, пропускаем")
          PY

      - name: Патч build.gradle для androidx.media
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()
          marker = "// RED_MUSIC_MEDIA_DEPENDENCY"

          if marker not in text:
              addition = (
                  f"\n{marker}\n"
                  "dependencies {\n"
                  '    implementation "androidx.media:media:1.7.0"\n'
                  "}\n"
              )
              p.write_text(text.rstrip() + "\n" + addition)
              print("build.gradle пропатчен (androidx.media добавлен)")
          else:
              print("build.gradle уже пропатчен, пропускаем")
          PY

      - name: Установить генератор иконок
        run: npm install @capacitor/assets --no-save

      - name: Сгенерировать иконку Red Music для Android
        run: npx capacitor-assets generate --android

      - name: Синхронизировать Capacitor
        run: npx cap sync android

      - name: Исправить Kotlin stdlib конфликт
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          text = p.read_text()
          marker = "// RED_MUSIC_KOTLIN_FIX"
          fix = (
              "\n// RED_MUSIC_KOTLIN_FIX\n"
              "configurations.configureEach {\n"
              '    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"\n'
              '    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"\n'
              "    resolutionStrategy.eachDependency { details ->\n"
              '        if (details.requested.group == "org.jetbrains.kotlin") {\n'
              '            details.useVersion "1.8.22"\n'
              "        }\n"
              "    }\n"
              "}\n"
          )
          if marker not in text:
              p.write_text(text.rstrip() + "\n" + fix)
          PY

      - name: Проверить Android Gradle Wrapper
        run: |
          if [ ! -f android/gradlew ]; then
            echo "ОШИБКА: android/gradlew не найден!"
            find android -maxdepth 3 -type f | sort | head -200
            exit 1
          fi
          chmod +x android/gradlew
          echo "Gradle Wrapper найден."

      - name: Проверить Render
        run: |
          curl --fail --silent --show-error https://red-music.onrender.com/health
          echo
          curl --fail --silent --show-error https://red-music.onrender.com/api/music/public-health
          echo

      - name: Собрать APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew clean --no-daemon
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Проверить APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ОШИБКА: APK не найден!"
            find android/app/build -type f | sort | head -200 || true
            exit 1
          fi
          echo "APK УСПЕШНО СОЗДАН!"
          ls -lh "$APK"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
