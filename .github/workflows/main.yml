name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v5

      - name: Установить Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Установить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Проверить окружение
        run: |
          node --version
          npm --version
          java -version

      - name: Установить зависимости
        run: npm install --legacy-peer-deps

      - name: Установить Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Подготовить Capacitor
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "Red Music" "com.redmusic.app" --web-dir=public
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Синхронизировать Android
        run: |
          npx cap sync android

      - name: Собрать APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
