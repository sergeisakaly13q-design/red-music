name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачать проект
      - name: Скачать проект
        uses: actions/checkout@v4

      # 2. Java 21
      # ВАЖНО: без cache: gradle, потому что Gradle-проект
      # появляется только после создания Capacitor Android
      - name: Установить Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # 3. Node.js
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 4. Проверка проекта
      - name: Проверить файлы проекта
        run: |
          echo "=== PROJECT FILES ==="
          ls -la
          echo "=== PACKAGE ==="

          if [ -f package.json ]; then
            cat package.json
          else
            echo "package.json отсутствует, создаём..."
            npm init -y
          fi

      # 5. Установить зависимости проекта
      - name: Установить зависимости
        run: npm install

      # 6. Установить Capacitor
      - name: Установить Capacitor
        run: |
          npm install @capacitor/core@latest
          npm install @capacitor/cli@latest
          npm install @capacitor/android@latest

      # 7. Подготовить web-папку
      - name: Подготовить web-файлы
        run: |
          mkdir -p public

          if [ -f index.html ]; then
            cp index.html public/index.html
          fi

          if [ -d css ]; then
            cp -r css public/
          fi

          if [ -d js ]; then
            cp -r js public/
          fi

          if [ -d assets ]; then
            cp -r assets public/
          fi

          if [ -d music ]; then
            cp -r music public/
          fi

          if [ -d songs ]; then
            cp -r songs public/
          fi

          if [ -d audio ]; then
            cp -r audio public/
          fi

          echo "=== PUBLIC ==="
          find public -maxdepth 3 -type f | head -100

      # 8. Создать Capacitor config
      - name: Создать конфигурацию Capacitor
        env:
          RED_MUSIC_SERVER_URL: ${{ vars.RED_MUSIC_SERVER_URL }}
        run: |
          SERVER_URL="${RED_MUSIC_SERVER_URL:-https://red-music.onrender.com}"

          cat > capacitor.config.json <<EOF
          {
            "appId": "com.redmusic.app",
            "appName": "Red Music",
            "webDir": "public",
            "server": {
              "url": "${SERVER_URL}",
              "cleartext": false
            },
            "android": {
              "backgroundColor": "#000000"
            }
          }
          EOF

          cat capacitor.config.json

      # 9. Создать Android-проект
      - name: Создать Android платформу
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android уже существует"
          fi

      # 10. Синхронизация Capacitor
      - name: Синхронизировать Android
        run: |
          npx cap sync android

      # 11. Проверить Gradle
      - name: Проверить Gradle
        run: |
          echo "=== ANDROID ==="
          ls -la android

          echo "=== GRADLE ==="
          ls -la android/gradlew
          ls -la android/gradle/wrapper

      # 12. Собрать APK
      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # 13. Загрузить APK
      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
