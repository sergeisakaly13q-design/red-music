name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # Скачать проект
      # =========================
      - name: Скачать проект
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 1

      # =========================
      # Java 17
      # =========================
      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # Node.js 22
      # БЕЗ cache, чтобы не требовался package-lock.json
      # =========================
      - name: Установить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      # =========================
      # Проверка проекта
      # =========================
      - name: Проверить проект
        run: |
          echo "=============================="
          echo "ПРОВЕРКА ПРОЕКТА"
          echo "=============================="

          if [ ! -d "android" ]; then
            echo "ОШИБКА: папка android отсутствует!"
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ОШИБКА: android/gradlew отсутствует!"
            exit 1
          fi

          if [ ! -f "android/app/build.gradle" ]; then
            echo "ОШИБКА: android/app/build.gradle отсутствует!"
            exit 1
          fi

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "ОШИБКА: AndroidManifest.xml отсутствует!"
            exit 1
          fi

          echo "Проект найден."

      # =========================
      # npm
      # =========================
      - name: Установить зависимости
        run: |
          npm install --no-audit --no-fund

      # =========================
      # Capacitor Assets
      # =========================
      - name: Установить генератор иконок
        run: |
          npm install @capacitor/assets --no-save --no-audit --no-fund

      # =========================
      # Media3
      # =========================
      - name: Проверить Media3 зависимости
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")

          if not p.exists():
              raise SystemExit(
                  "ОШИБКА: android/app/build.gradle не найден!"
              )

          text = p.read_text()

          media3_version = "1.10.1"

          # Удаляем старую androidx.media
          text = re.sub(
              r'^\s*implementation\s+[\'"]androidx\.media:media:[^\'"]+[\'"]\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          exoplayer = (
              f'implementation "androidx.media3:media3-exoplayer:{media3_version}"'
          )

          session = (
              f'implementation "androidx.media3:media3-session:{media3_version}"'
          )

          if "androidx.media3:media3-exoplayer" not in text:

              match = re.search(r'dependencies\s*\{', text)

              if match:
                  insert_pos = match.end()

                  additions = (
                      f"\n    {exoplayer}\n"
                      f"    {session}\n"
                  )

                  text = text[:insert_pos] + additions + text[insert_pos:]

              else:
                  text += (
                      "\n\ndependencies {\n"
                      f"    {exoplayer}\n"
                      f"    {session}\n"
                      "}\n"
                  )

          p.write_text(text)

          print("Media3 зависимости проверены.")
          print("Media3 версия:", media3_version)
          PY

      # =========================
      # AndroidManifest
      # =========================
      - name: Проверить AndroidManifest для Media3
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          if not p.exists():
              raise SystemExit(
                  "ОШИБКА: AndroidManifest.xml не найден!"
              )

          text = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />'
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      "</manifest>",
                      f"    {permission}\n</manifest>",
                      1
                  )

          service_name = 'android:name=".RedMusicMediaService"'

          if service_name not in text:

              service_block = '''
          <service
              android:name=".RedMusicMediaService"
              android:exported="true"
              android:foregroundServiceType="mediaPlayback">
              <intent-filter>
                  <action android:name="androidx.media3.session.MediaSessionService" />
              </intent-filter>
          </service>
          '''

              text = text.replace(
                  "</application>",
                  service_block + "\n    </application>",
                  1
              )

          p.write_text(text)

          print("AndroidManifest.xml проверен.")
          PY

      # =========================
      # Проверка Media3 файлов
      # =========================
      - name: Проверить Media3 файлы
        run: |
          echo "Проверяем Media3-файлы..."

          find android/app/src/main -type f \
            \( -name "RedMusicMediaService.kt" \
            -o -name "RedMusicMediaPlugin.kt" \
            -o -name "MainActivity.kt" \) \
            -print

          if [ ! -f "android/app/src/main/java/com/redmusic/app/RedMusicMediaService.kt" ]; then
            echo "ОШИБКА: RedMusicMediaService.kt не найден!"
            exit 1
          fi

          if [ ! -f "android/app/src/main/java/com/redmusic/app/RedMusicMediaPlugin.kt" ]; then
            echo "ОШИБКА: RedMusicMediaPlugin.kt не найден!"
            exit 1
          fi

          echo "Media3-файлы найдены."

      # =========================
      # Аудиофайлы
      # =========================
      - name: Проверить аудиофайлы
        run: |
          echo "Аудиофайлы:"

          find . -type f \
            \( -iname "*.mp3" \
            -o -iname "*.wav" \
            -o -iname "*.ogg" \
            -o -iname "*.m4a" \
            -o -iname "*.flac" \) \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            | head -100 || true

      # =========================
      # Иконка
      # =========================
      - name: Сгенерировать иконку Red Music
        run: |
          npx capacitor-assets generate --android

      # =========================
      # Capacitor
      # =========================
      - name: Синхронизировать Capacitor
        run: |
          npx cap sync android

      # =========================
      # Gradle Wrapper
      # =========================
      - name: Настроить Android Gradle Wrapper
        run: |
          set -e

          echo "=============================="
          echo "НАСТРОЙКА GRADLE WRAPPER"
          echo "=============================="

          if [ ! -f "android/gradlew" ]; then
            echo "ОШИБКА: android/gradlew не найден!"
            exit 1
          fi

          mkdir -p android/gradle/wrapper

          cat > android/gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          chmod +x android/gradlew

          echo "Gradle Wrapper настроен."
          cat android/gradle/wrapper/gradle-wrapper.properties

      # =========================
      # Проверка Gradle
      # =========================
      - name: Проверить Gradle
        run: |
          cd android

          chmod +x gradlew

          ./gradlew --version

      # =========================
      # Проверка Render
      # =========================
      - name: Проверить Render
        run: |
          curl --fail --silent --show-error \
            https://red-music.onrender.com/health

          echo

          curl --fail --silent --show-error \
            https://red-music.onrender.com/api/music/public-health

          echo

      # =========================
      # Сборка APK
      # =========================
      - name: Собрать APK
        run: |
          cd android

          chmod +x gradlew

          ./gradlew clean --no-daemon

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # =========================
      # Проверка APK
      # =========================
      - name: Проверить APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ОШИБКА: APK не найден!"

            find android/app/build \
              -type f \
              | sort \
              | head -200 || true

            exit 1
          fi

          echo "===================================="
          echo "APK УСПЕШНО СОЗДАН!"
          echo "===================================="

          ls -lh "$APK"

      # =========================
      # Скачать APK из Actions
      # =========================
      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
