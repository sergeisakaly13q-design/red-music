name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 1

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm

      - name: Проверить проект
        run: |
          echo "Проверяем структуру проекта..."

          if [ ! -d "android" ]; then
            echo "ОШИБКА: папка android отсутствует!"
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ОШИБКА: android/gradlew отсутствует!"
            exit 1
          fi

          if [ ! -f "android/app/build.gradle" ]; then
            echo "ОШИБКА: android/app/build.gradle отсутствует!"
            exit 1
          fi

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "ОШИБКА: AndroidManifest.xml отсутствует!"
            exit 1
          fi

          echo "Android-проект найден."

      - name: Проверить Media3 файлы
        run: |
          echo "Проверяем Media3..."

          find android/app/src/main -type f \
            \( -name "RedMusicMediaService.kt" \
            -o -name "RedMusicMediaPlugin.kt" \
            -o -name "MainActivity.kt" \) \
            -print

          if [ ! -f "android/app/src/main/java/com/redmusic/app/RedMusicMediaService.kt" ]; then
            echo "ОШИБКА: RedMusicMediaService.kt не найден!"
            exit 1
          fi

          if [ ! -f "android/app/src/main/java/com/redmusic/app/RedMusicMediaPlugin.kt" ]; then
            echo "ОШИБКА: RedMusicMediaPlugin.kt не найден!"
            exit 1
          fi

          if [ ! -f "android/app/src/main/java/com/redmusic/app/MainActivity.kt" ]; then
            echo "ОШИБКА: MainActivity.kt не найден!"
            exit 1
          fi

          echo "Media3-файлы найдены."

      - name: Проверить большие аудиофайлы
        run: |
          echo "Аудиофайлы, попавшие в checkout:"

          find . -type f \
            \( -iname "*.mp3" \
            -o -iname "*.wav" \
            -o -iname "*.ogg" \
            -o -iname "*.m4a" \
            -o -iname "*.flac" \) \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            | head -100 || true

      - name: Установить зависимости
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Установить генератор иконок
        run: npm install @capacitor/assets --no-save --no-audit --no-fund

      - name: Проверить Media3 зависимости
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")

          if not p.exists():
              raise SystemExit(
                  "ОШИБКА: android/app/build.gradle не найден!"
              )

          text = p.read_text()

          media3_version = "1.10.1"

          # Удаляем старую androidx.media
          text = re.sub(
              r'^\s*implementation\s+[\'"]androidx\.media:media:[^\'"]+[\'"]\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          exoplayer = (
              f'implementation "androidx.media3:media3-exoplayer:{media3_version}"'
          )

          session = (
              f'implementation "androidx.media3:media3-session:{media3_version}"'
          )

          # Удаляем старые Media3 зависимости, чтобы не было конфликтов
          text = re.sub(
              r'^\s*implementation\s+[\'"]androidx\.media3:media3-exoplayer:[^\'"]+[\'"]\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^\s*implementation\s+[\'"]androidx\.media3:media3-session:[^\'"]+[\'"]\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          match = re.search(r'dependencies\s*\{', text)

          if match:
              insert_pos = match.end()

              additions = (
                  f"\n    {exoplayer}\n"
                  f"    {session}\n"
              )

              text = text[:insert_pos] + additions + text[insert_pos:]

          else:
              text += (
                  "\n\ndependencies {\n"
                  f"    {exoplayer}\n"
                  f"    {session}\n"
                  "}\n"
              )

          p.write_text(text)

          print("Media3 зависимости установлены.")
          print(f"Media3 версия: {media3_version}")
          PY

      - name: Проверить AndroidManifest для Media3
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          if not p.exists():
              raise SystemExit(
                  "ОШИБКА: android/app/src/main/AndroidManifest.xml не найден!"
              )

          text = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />'
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      "</manifest>",
                      f"    {permission}\n</manifest>",
                      1
                  )

          service_name = 'android:name=".RedMusicMediaService"'

          if service_name not in text:
              service_block = '''
          <service
              android:name=".RedMusicMediaService"
              android:exported="true"
              android:foregroundServiceType="mediaPlayback">
              <intent-filter>
                  <action android:name="androidx.media3.session.MediaSessionService" />
              </intent-filter>
          </service>
          '''

              text = text.replace(
                  "</application>",
                  service_block + "\n    </application>",
                  1
              )

          p.write_text(text)

          print("AndroidManifest.xml проверен.")
          PY

      - name: Сгенерировать иконку Red Music для Android
        run: npx capacitor-assets generate --android

      - name: Синхронизировать Capacitor
        run: npx cap sync android

      # ВАЖНО:
      # Capacitor может изменить Gradle Wrapper после sync.
      # Поэтому принудительно задаём рабочую версию ПОСЛЕ sync.
      - name: Зафиксировать Android Gradle Wrapper
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/gradle/wrapper/gradle-wrapper.properties")

          if not p.exists():
              raise SystemExit(
                  "ОШИБКА: android/gradle/wrapper/gradle-wrapper.properties не найден!"
              )

          content = """distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\\://services.gradle.org/distributions/gradle-8.2.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          """

          p.write_text(content.strip() + "\n")

          print("Gradle Wrapper зафиксирован на версии 8.2.1.")
          print(p.read_text())
          PY

      - name: Проверить Android Gradle Wrapper
        run: |
          if [ ! -f android/gradlew ]; then
            echo "ОШИБКА: android/gradlew не найден!"
            exit 1
          fi

          if [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            echo "ОШИБКА: gradle-wrapper.properties не найден!"
            exit 1
          fi

          chmod +x android/gradlew

          echo "===================================="
          echo "Gradle Wrapper найден."
          echo "===================================="

          echo "Версия из gradle-wrapper.properties:"
          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties

          echo "===================================="
          echo "Запускаем Gradle Wrapper..."
          echo "===================================="

          cd android
          ./gradlew --version --no-daemon

      - name: Проверить Render
        run: |
          echo "Проверяем основной сервер..."

          curl --fail --silent --show-error \
            https://red-music.onrender.com/health

          echo

          echo "Проверяем музыкальный API..."

          curl --fail --silent --show-error \
            https://red-music.onrender.com/api/music/public-health

          echo

          echo "Render работает."

      - name: Собрать APK
        run: |
          chmod +x android/gradlew

          cd android

          echo "===================================="
          echo "ОЧИСТКА GRADLE"
          echo "===================================="

          ./gradlew clean --no-daemon

          echo "===================================="
          echo "СБОРКА RED MUSIC APK"
          echo "===================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Проверить APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ОШИБКА: APK не найден!"

            echo "Ищем созданные APK:"
            find android/app/build \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              | sort \
              | head -200 || true

            exit 1
          fi

          echo "===================================="
          echo "APK УСПЕШНО СОЗДАН!"
          echo "===================================="

          ls -lh "$APK"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
