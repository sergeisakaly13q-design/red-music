name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установить зависимости
        run: npm install

      - name: Установить Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Создать конфигурацию Capacitor
        env:
          RED_MUSIC_SERVER_URL: ${{ vars.RED_MUSIC_SERVER_URL }}
        run: |
          SERVER_URL="${RED_MUSIC_SERVER_URL:-https://red-music.onrender.com}"
          node -e "const fs=require('fs'); const cfg={appId:'com.redmusic.app',appName:'Red Music',webDir:'public',server:{url:process.env.SERVER_URL,cleartext:false}}; fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg,null,2)+'\\n')" 

      - name: Добавить Android платформу
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Установить генератор иконки
        run: npm install @capacitor/assets --no-save

      - name: Сгенерировать иконку Red Music
        run: npx capacitor-assets generate --android

      - name: Синхронизировать приложение
        run: npx cap sync android

      - name: Собрать APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
