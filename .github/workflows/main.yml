name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Проверить большие аудиофайлы
        run: |
          echo "Аудиофайлы, попавшие в checkout:"
          find . -type f \( \
            -iname "*.mp3" -o \
            -iname "*.wav" -o \
            -iname "*.ogg" -o \
            -iname "*.m4a" -o \
            -iname "*.flac" \
          \) \
          -not -path "./node_modules/*" \
          -not -path "./.git/*" \
          | head -100 || true

      - name: Установить зависимости
        run: npm install --no-audit --no-fund

      - name: Создать конфигурацию Capacitor
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const config = {
            appId: 'com.redmusic.app',
            appName: 'Red Music',
            webDir: 'public',
            server: {
              url: 'https://red-music.onrender.com',
              cleartext: false,
              androidScheme: 'https',
              allowNavigation: [
                'red-music.onrender.com',
                '*.onrender.com'
              ]
            }
          };

          fs.writeFileSync(
            'capacitor.config.json',
            JSON.stringify(config, null, 2) + '\n'
          );
          NODE

      - name: Добавить Android платформу
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Установить генератор иконок
        run: npm install @capacitor/assets --no-save

      - name: Сгенерировать иконку Red Music для Android
        run: npx capacitor-assets generate --android

      - name: Синхронизировать Capacitor
        run: npx cap sync android

      - name: Исправить совместимость AndroidX Core
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          marker = "// RED_MUSIC_ANDROIDX_CORE_FIX"

          fix = """
// RED_MUSIC_ANDROIDX_CORE_FIX
configurations.configureEach {
    resolutionStrategy.force "androidx.core:core:1.13.1"
    resolutionStrategy.force "androidx.core:core-ktx:1.13.1"
}
"""

          if marker not in text:
              p.write_text(text.rstrip() + "\n" + fix)

          print("AndroidX Core compatibility fix applied.")
          PY

      - name: Исправить Kotlin stdlib конфликт
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          marker = "// RED_MUSIC_KOTLIN_FIX"

          fix = """
// RED_MUSIC_KOTLIN_FIX
configurations.configureEach {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"

    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.jetbrains.kotlin") {
            details.useVersion "1.8.22"
        }
    }
}
"""

          if marker not in text:
              p.write_text(text.rstrip() + "\n" + fix)

          print("Kotlin compatibility fix applied.")
          PY

      - name: Проверить Android конфигурацию
        run: |
          echo "=== Android build.gradle ==="
          cat android/app/build.gradle

          echo "=== Gradle version ==="
          cd android
          ./gradlew --version

      - name: Проверить Render
        run: |
          curl --fail --silent --show-error \
            https://red-music.onrender.com/health

          echo

          curl --fail --silent --show-error \
            https://red-music.onrender.com/api/music/public-health

          echo

      - name: Собрать APK
        run: |
          chmod +x android/gradlew

          cd android

          ./gradlew clean --no-daemon

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Проверить APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk

          echo "APK успешно создан:"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
