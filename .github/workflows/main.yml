name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Проверить проект
        run: |
          echo "Проверка файлов проекта..."
          ls -la
          test -f package.json
          echo "package.json найден"

      - name: Установить npm зависимости
        run: npm install

      - name: Установить Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Создать Capacitor config
        env:
          RED_MUSIC_SERVER_URL: ${{ vars.RED_MUSIC_SERVER_URL }}
        run: |
          SERVER_URL="${RED_MUSIC_SERVER_URL:-https://red-music.onrender.com}"

          cat > capacitor.config.json <<EOF
          {
            "appId": "com.redmusic.app",
            "appName": "Red Music",
            "webDir": "public",
            "server": {
              "url": "${SERVER_URL}",
              "cleartext": false
            }
          }
          EOF

          echo "Server URL: ${SERVER_URL}"

      - name: Создать Android платформу
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android уже существует"
          fi

      - name: Синхронизировать Capacitor
        run: |
          npx cap sync android

      - name: Исправить конфликт Kotlin
        run: |
          mkdir -p .github/gradle

          cat > .github/gradle/kotlin-fix.gradle <<'EOF'
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin") {
                          if (
                              details.requested.name == "kotlin-stdlib" ||
                              details.requested.name == "kotlin-stdlib-jdk7" ||
                              details.requested.name == "kotlin-stdlib-jdk8"
                          ) {
                              details.useVersion("1.8.22")
                              details.because("Fix Kotlin stdlib duplicate classes")
                          }
                      }
                  }
              }
          }
          EOF

      - name: Проверить Android проект
        run: |
          test -f android/gradlew
          test -d android/app
          echo "Android проект найден"

      - name: Подготовить Gradle
        run: |
          chmod +x android/gradlew

      - name: Очистить старые Gradle файлы
        working-directory: android
        run: |
          ./gradlew clean --no-daemon --stacktrace

      - name: Собрать APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            --init-script ../.github/gradle/kotlin-fix.gradle

      - name: Проверить APK
        run: |
          echo "Проверяем результат сборки..."
          ls -lah android/app/build/outputs/apk/debug/

          test -f android/app/build/outputs/apk/debug/app-debug.apk

          echo "APK успешно создан!"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
