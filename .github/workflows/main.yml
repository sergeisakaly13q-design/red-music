name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 1

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Установить Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Установить Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Проверить проект
        run: |
          test -d android
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          echo 'Android-проект найден.'

      - name: Проверить аудиофайлы
        run: |
          find . -type f \
            \( -iname '*.mp3' -o -iname '*.wav' -o -iname '*.ogg' -o -iname '*.m4a' -o -iname '*.flac' \) \
            -not -path './node_modules/*' \
            -not -path './.git/*' | head -100 || true

      - name: Установить зависимости
        run: npm install --no-audit --no-fund

      - name: Создать конфигурацию Capacitor
        run: |
          node -e "require('fs').writeFileSync('capacitor.config.json', JSON.stringify({appId:'com.redmusic.app',appName:'Red Music',webDir:'public',server:{url:'https://red-music.onrender.com',cleartext:false,androidScheme:'https',allowNavigation:['red-music.onrender.com','*.onrender.com']}},null,2)+'\n')"

      - name: Установить генератор иконок
        run: npm install @capacitor/assets --no-save --no-audit --no-fund

      - name: Сгенерировать иконку Red Music для Android
        run: npx capacitor-assets generate --android

      - name: Синхронизировать Capacitor
        run: npx cap sync android

      - name: Исправить Kotlin stdlib конфликт
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          marker = '// RED_MUSIC_KOTLIN_FIX'
          fix = """
          // RED_MUSIC_KOTLIN_FIX
          configurations.configureEach {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == 'org.jetbrains.kotlin') {
                      details.useVersion '1.9.22'
                  }
              }
          }
          """
          if marker not in text:
              p.write_text(text.rstrip() + '\n' + fix)
          PY

      - name: Настроить Android Gradle Wrapper 8.7
        run: |
          cd android
          gradle wrapper --gradle-version 8.7 --distribution-type bin --no-daemon
          chmod +x gradlew
          ./gradlew --version

      - name: Проверить Render
        run: |
          curl --fail --silent --show-error https://red-music.onrender.com/health
          echo
          curl --fail --silent --show-error https://red-music.onrender.com/api/music/public-health
          echo

      - name: Собрать APK
        run: |
          cd android
          ./gradlew clean --no-daemon
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Проверить APK
        run: |
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          if [ ! -f "$APK" ]; then
            echo 'ОШИБКА: APK не найден!'
            find android/app/build -type f | sort | head -200 || true
            exit 1
          fi
          echo 'APK УСПЕШНО СОЗДАН!'
          ls -lh "$APK"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
