name: Build Red Music APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # Скачать проект
      - name: Скачать проект
        uses: actions/checkout@v4

      # Java 21
      - name: Установить Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Node.js
      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Установить зависимости проекта
      - name: Установить зависимости
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Установить Capacitor
      - name: Установить Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm install @capacitor/assets --save-dev

      # Создать Capacitor config
      - name: Создать конфигурацию Capacitor
        env:
          RED_MUSIC_SERVER_URL: ${{ vars.RED_MUSIC_SERVER_URL }}
        run: |
          SERVER_URL="${RED_MUSIC_SERVER_URL:-https://red-music.onrender.com}"

          node <<'NODE'
          const fs = require('fs');

          const serverUrl =
            process.env.RED_MUSIC_SERVER_URL ||
            'https://red-music.onrender.com';

          const config = {
            appId: 'com.redmusic.app',
            appName: 'Red Music',
            webDir: 'public',
            server: {
              url: serverUrl,
              cleartext: false
            }
          };

          fs.writeFileSync(
            'capacitor.config.json',
            JSON.stringify(config, null, 2) + '\n'
          );

          console.log('Capacitor config создан');
          console.log('Server:', serverUrl);
          NODE

      # Создать Android заново
      - name: Создать Android платформу
        run: |
          rm -rf android
          npx cap add android

      # Сгенерировать иконку, если она есть
      - name: Сгенерировать иконку Red Music
        run: |
          if [ -f resources/icon.png ]; then
            echo "Найдена иконка Red Music"
            npx capacitor-assets generate --android
          else
            echo "resources/icon.png не найдена, используем стандартную иконку"
          fi

      # Синхронизация
      - name: Синхронизировать Capacitor
        run: |
          npx cap sync android

      # Подготовить Gradle
      - name: Подготовить Gradle
        run: |
          chmod +x android/gradlew

      # Собрать APK
      - name: Собрать APK
        working-directory: android
        run: |
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      # Проверить APK
      - name: Проверить APK
        run: |
          echo "Проверяем APK..."
          ls -lah android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      # Загрузить готовый APK
      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
