name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Установить зависимости проекта
        run: npm install

      - name: Установить Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Создать конфигурацию Capacitor
        run: |
          node <<'NODE'
          const fs = require("fs");
          const cfg = {
            appId: "com.redmusic.app",
            appName: "Red Music",
            webDir: "public",
            server: {
              url: "https://red-music.onrender.com",
              cleartext: false,
              androidScheme: "https",
              allowNavigation: [
                "red-music.onrender.com",
                "*.onrender.com"
              ]
            }
          };
          fs.writeFileSync(
            "capacitor.config.json",
            JSON.stringify(cfg, null, 2) + "\n"
          );
          NODE

      - name: Добавить Android платформу
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Установить генератор иконки
        run: npm install @capacitor/assets --no-save

      - name: Сгенерировать иконку Red Music
        run: npx capacitor-assets generate --android

      - name: Синхронизировать Capacitor
        run: npx cap sync android

      - name: Исправить конфликт Kotlin stdlib
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")
          text = p.read_text()

          marker = "// Red Music Kotlin stdlib fix"
          if marker not in text:
              text += '''
// Red Music Kotlin stdlib fix
configurations.configureEach {
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
    exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"

    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "org.jetbrains.kotlin") {
            details.useVersion "1.8.22"
        }
    }
}
'''
              p.write_text(text)
          PY

      - name: Проверить сервер Red Music
        run: |
          curl --fail --silent --show-error https://red-music.onrender.com/health
          echo
          curl --fail --silent --show-error https://red-music.onrender.com/api/music/public-health
          echo

      - name: Собрать APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew clean --no-daemon
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Проверить APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
