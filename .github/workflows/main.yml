name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Проверить проект
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "ПРОВЕРКА ПРОЕКТА"
          echo "===================================="

          if [ ! -d "android" ]; then
            echo "ОШИБКА: папка android отсутствует!"
            exit 1
          fi

          if [ ! -f "android/app/build.gradle" ]; then
            echo "ОШИБКА: android/app/build.gradle отсутствует!"
            exit 1
          fi

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "ОШИБКА: AndroidManifest.xml отсутствует!"
            exit 1
          fi

          echo "Android-проект найден."

      - name: Установить зависимости Node.js
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "УСТАНОВКА NODE.JS ЗАВИСИМОСТЕЙ"
          echo "===================================="

          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Установить генератор иконок
        shell: bash
        run: |
          npm install @capacitor/assets --no-save --no-audit --no-fund

      - name: Проверить Media3 зависимости
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")

          if not p.exists():
              raise SystemExit(
                  "ОШИБКА: android/app/build.gradle не найден!"
              )

          text = p.read_text()

          media3_version = "1.10.1"

          # Удаляем старую androidx.media
          text = re.sub(
              r'^\s*implementation\s+[\'"]androidx\.media:media:[^\'"]+[\'"]\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          exoplayer = (
              f'implementation "androidx.media3:media3-exoplayer:{media3_version}"'
          )

          session = (
              f'implementation "androidx.media3:media3-session:{media3_version}"'
          )

          if "androidx.media3:media3-exoplayer" not in text:

              match = re.search(r'dependencies\s*\{', text)

              if match:
                  insert_pos = match.end()

                  additions = (
                      f"\n    {exoplayer}\n"
                      f"    {session}\n"
                  )

                  text = (
                      text[:insert_pos]
                      + additions
                      + text[insert_pos:]
                  )

              else:
                  text += (
                      "\n\ndependencies {\n"
                      f"    {exoplayer}\n"
                      f"    {session}\n"
                      "}\n"
                  )

          p.write_text(text)

          print("Media3 зависимости готовы.")
          print("Media3 версия:", media3_version)
          PY

      - name: Проверить AndroidManifest для Media3
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          if not p.exists():
              raise SystemExit(
                  "ОШИБКА: AndroidManifest.xml не найден!"
              )

          text = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />'
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      "</manifest>",
                      f"    {permission}\n</manifest>",
                      1
                  )

          service_name = 'android:name=".RedMusicMediaService"'

          if service_name not in text:

              service_block = '''
          <service
              android:name=".RedMusicMediaService"
              android:exported="true"
              android:foregroundServiceType="mediaPlayback">
              <intent-filter>
                  <action android:name="androidx.media3.session.MediaSessionService" />
              </intent-filter>
          </service>
          '''

              text = text.replace(
                  "</application>",
                  service_block + "\n    </application>",
                  1
              )

          p.write_text(text)

          print("AndroidManifest.xml готов.")
          PY

      - name: Проверить Media3 Kotlin файлы
        shell: bash
        run: |
          set -e

          SERVICE="android/app/src/main/java/com/redmusic/app/RedMusicMediaService.kt"
          PLUGIN="android/app/src/main/java/com/redmusic/app/RedMusicMediaPlugin.kt"

          if [ ! -f "$SERVICE" ]; then
            echo "ОШИБКА: $SERVICE не найден!"
            exit 1
          fi

          if [ ! -f "$PLUGIN" ]; then
            echo "ОШИБКА: $PLUGIN не найден!"
            exit 1
          fi

          echo "Media3 Kotlin файлы найдены."

      - name: Проверить аудиофайлы
        shell: bash
        run: |
          echo "Аудиофайлы проекта:"

          find . -type f \
            \( -iname "*.mp3" \
            -o -iname "*.wav" \
            -o -iname "*.ogg" \
            -o -iname "*.m4a" \
            -o -iname "*.flac" \) \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            | head -100 || true

      - name: Сгенерировать иконку Red Music
        shell: bash
        run: |
          npx capacitor-assets generate --android

      - name: Синхронизировать Capacitor
        shell: bash
        run: |
          npx cap sync android

      - name: Установить Gradle 8.2.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.2"

      - name: Проверить Gradle
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo "ПРОВЕРКА GRADLE"
          echo "===================================="

          gradle --version

      - name: Проверить Android проект
        shell: bash
        run: |
          set -e

          cd android

          echo "Проверяем Gradle проект..."

          gradle tasks \
            --no-daemon \
            --stacktrace

      - name: Проверить Render
        shell: bash
        run: |
          echo "Проверяем сервер Red Music..."

          curl --fail --silent --show-error \
            --max-time 30 \
            https://red-music.onrender.com/health \
            || echo "WARNING: /health недоступен"

          echo

          curl --fail --silent --show-error \
            --max-time 30 \
            https://red-music.onrender.com/api/music/public-health \
            || echo "WARNING: /api/music/public-health недоступен"

          echo

      - name: Собрать APK
        shell: bash
        run: |
          set -e

          cd android

          echo "===================================="
          echo "СБОРКА RED MUSIC APK"
          echo "===================================="

          gradle clean \
            --no-daemon \
            --stacktrace

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Проверить APK
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ОШИБКА: APK не найден!"

            find android/app/build \
              -type f \
              | sort \
              | head -200 || true

            exit 1
          fi

          echo "===================================="
          echo "APK УСПЕШНО СОЗДАН!"
          echo "===================================="

          ls -lh "$APK"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
