name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Проверить аудиофайлы
        shell: bash
        run: |
          echo "Проверка аудиофайлов:"
          find public/music -type f \
            \( -iname "*.mp3" -o -iname "*.wav" -o -iname "*.ogg" -o -iname "*.m4a" -o -iname "*.flac" \) \
            2>/dev/null | head -100 || true

      - name: Установить зависимости
        run: npm install --no-audit --no-fund

      - name: Установить Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund
          npm install @capacitor/assets --no-save --no-audit --no-fund

      - name: Создать конфигурацию Capacitor
        shell: bash
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.redmusic.app",
            "appName": "Red Music",
            "webDir": "public",
            "server": {
              "url": "https://red-music.onrender.com",
              "cleartext": false,
              "androidScheme": "https"
            }
          }
          EOF

      - name: Добавить Android платформу
        shell: bash
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Сгенерировать иконку приложения
        shell: bash
        run: |
          if [ -d "resources" ]; then
            npx capacitor-assets generate --android
          else
            echo "Папка resources отсутствует. Используем стандартную иконку."
          fi

      - name: Синхронизировать Capacitor
        run: npx cap sync android

      - name: Исправить Kotlin зависимости
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle")

          if not p.exists():
              raise SystemExit("android/app/build.gradle не найден")

          text = p.read_text()

          marker = "// RED_MUSIC_KOTLIN_FIX"

          fix = r'''
          // RED_MUSIC_KOTLIN_FIX
          configurations.configureEach {
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
              exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"

              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == "org.jetbrains.kotlin") {
                      details.useVersion "1.8.22"
                  }
              }
          }
          '''

          if marker not in text:
              p.write_text(text.rstrip() + "\n\n" + fix + "\n")
              print("Kotlin fix добавлен")
          else:
              print("Kotlin fix уже существует")
          PY

      - name: Проверить Render
        shell: bash
        run: |
          echo "Проверяем основной сервер..."
          curl --fail --silent --show-error \
            https://red-music.onrender.com/health

          echo
          echo "Проверяем музыку..."
          curl --fail --silent --show-error \
            https://red-music.onrender.com/api/music/public-health

          echo

      - name: Проверить музыкальную папку
        shell: bash
        run: |
          echo "Проверяем public/music..."

          if [ ! -d "public/music" ]; then
            echo "Внимание: public/music отсутствует в репозитории."
          else
            echo "Количество аудиофайлов:"
            find public/music -type f \
              \( -iname "*.mp3" -o -iname "*.wav" -o -iname "*.ogg" -o -iname "*.m4a" -o -iname "*.flac" \) \
              | wc -l
          fi

      - name: Собрать APK
        shell: bash
        run: |
          chmod +x android/gradlew

          cd android

          ./gradlew clean --no-daemon

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Проверить APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK не найден: $APK"
            exit 1
          fi

          echo "APK успешно создан:"
          ls -lh "$APK"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
