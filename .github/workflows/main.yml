name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установить зависимости
        run: npm install

      - name: Установить Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Создать Capacitor config
        env:
          RED_MUSIC_SERVER_URL: ${{ vars.RED_MUSIC_SERVER_URL }}
        run: |
          SERVER_URL="${RED_MUSIC_SERVER_URL:-https://red-music.onrender.com}"

          cat > capacitor.config.json <<EOF
          {
            "appId": "com.redmusic.app",
            "appName": "Red Music",
            "webDir": "public",
            "server": {
              "url": "${SERVER_URL}",
              "cleartext": false
            }
          }
          EOF

          echo "Используется сервер: ${SERVER_URL}"

      - name: Проверить Capacitor config
        run: |
          cat capacitor.config.json

      - name: Создать Android платформу
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android платформа уже существует"
          fi

      - name: Синхронизировать Capacitor
        run: |
          npx cap sync android

      - name: Проверить Android проект
        run: |
          test -f android/gradlew
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -d android/app
          echo "Android проект найден"

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Проверить APK
        run: |
          ls -lah android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
