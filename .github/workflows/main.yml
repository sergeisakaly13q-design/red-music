name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Проверить проект
        run: |
          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Структура проекта:"
          ls -la

          echo "Android:"
          if [ -d android ]; then
            echo "Папка android найдена"
          else
            echo "Папка android отсутствует"
          fi

      - name: Проверить аудиофайлы
        run: |
          echo "Аудиофайлы:"
          find . \
            -type f \
            \( \
              -iname "*.mp3" -o \
              -iname "*.wav" -o \
              -iname "*.ogg" -o \
              -iname "*.m4a" -o \
              -iname "*.flac" \
            \) \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            | head -100 || true

      - name: Установить зависимости
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Проверить Capacitor
        run: |
          npx cap --version
          npx cap doctor || true

      - name: Создать capacitor.config.json
        run: |
          node <<'NODE'
          const fs = require("fs");

          const config = {
            appId: "com.redmusic.app",
            appName: "Red Music",
            webDir: "public",
            server: {
              url: "https://red-music.onrender.com",
              cleartext: false,
              androidScheme: "https",
              allowNavigation: [
                "red-music.onrender.com",
                "*.onrender.com"
              ]
            }
          };

          fs.writeFileSync(
            "capacitor.config.json",
            JSON.stringify(config, null, 2) + "\n"
          );

          console.log("capacitor.config.json создан");
          NODE

      - name: Проверить Android проект
        run: |
          if [ ! -d "android" ]; then
            echo "Android проекта нет. Создаём Capacitor Android..."
            npx cap add android
          else
            echo "Android проект уже существует. Используем его."
          fi

      - name: Синхронизировать Capacitor
        run: |
          npx cap sync android

      - name: Проверить Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --version

      - name: Собрать APK
        run: |
          chmod +x android/gradlew

          cd android

          ./gradlew clean \
            --no-daemon \
            --stacktrace

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Проверить APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ОШИБКА: APK не найден!"
            echo "Содержимое build:"
            find android/app/build -type f | head -100 || true
            exit 1
          fi

          echo "APK успешно создан:"
          ls -lh "$APK"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
