name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 1

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Проверить проект
        run: |
          echo "Проверяем структуру проекта..."

          if [ ! -d "android" ]; then
            echo "ОШИБКА: папка android отсутствует!"
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ОШИБКА: android/gradlew отсутствует!"
            exit 1
          fi

          if [ ! -f "android/app/build.gradle" ]; then
            echo "ОШИБКА: android/app/build.gradle отсутствует!"
            exit 1
          fi

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "ОШИБКА: AndroidManifest.xml отсутствует!"
            exit 1
          fi

          echo "Android-проект найден."

      - name: Проверить Media3 файлы
        run: |
          echo "Проверяем Media3..."

          find android/app/src/main -type f \
            \( -name "RedMusicMediaService.kt" \
            -o -name "RedMusicMediaPlugin.kt" \
            -o -name "MainActivity.kt" \) \
            -print

          if [ ! -f "android/app/src/main/java/com/redmusic/app/RedMusicMediaService.kt" ]; then
            echo "ОШИБКА: RedMusicMediaService.kt не найден!"
            exit 1
          fi

          if [ ! -f "android/app/src/main/java/com/redmusic/app/RedMusicMediaPlugin.kt" ]; then
            echo "ОШИБКА: RedMusicMediaPlugin.kt не найден!"
            exit 1
          fi

          echo "Media3-файлы найдены."

      - name: Проверить большие аудиофайлы
        run: |
          echo "Аудиофайлы, попавшие в checkout:"

          find . -type f \
            \( -iname "*.mp3" \
            -o -iname "*.wav" \
            -o -iname "*.ogg" \
            -o -iname "*.m4a" \
            -o -iname "*.flac" \) \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            | head -100 || true

      - name: Установить зависимости
        run: npm install --no-audit --no-fund

      - name: Установить генератор иконок
        run: npm install @capacitor/assets --no-save

      - name: Проверить Media3 зависимости
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")

          if not p.exists():
              raise SystemExit("ОШИБКА: android/app/build.gradle не найден!")

          text = p.read_text()

          media3_version = "1.10.1"

          # Удаляем старую androidx.media, если она осталась
          text = re.sub(
              r'^\s*implementation\s+[\'"]androidx\.media:media:[^\'"]+[\'"]\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          exoplayer = (
              f'implementation "androidx.media3:media3-exoplayer:{media3_version}"'
          )

          session = (
              f'implementation "androidx.media3:media3-session:{media3_version}"'
          )

          # Добавляем Media3 только если её ещё нет
          if "androidx.media3:media3-exoplayer" not in text:

              match = re.search(r'dependencies\s*\{', text)

              if match:
                  insert_pos = match.end()

                  additions = (
                      f"\n    {exoplayer}\n"
                      f"    {session}\n"
                  )

                  text = text[:insert_pos] + additions + text[insert_pos:]

              else:
                  text += (
                      "\n\ndependencies {\n"
                      f"    {exoplayer}\n"
                      f"    {session}\n"
                      "}\n"
                  )

          p.write_text(text)

          print("Media3 зависимости проверены.")
          print(f"Media3 версия: {media3_version}")
          PY

      - name: Проверить AndroidManifest для Media3
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          if not p.exists():
              raise SystemExit(
                  "ОШИБКА: android/app/src/main/AndroidManifest.xml не найден!"
              )

          text = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />'
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      "</manifest>",
                      f"    {permission}\n</manifest>",
                      1
                  )

          service_name = 'android:name=".RedMusicMediaService"'

          if service_name not in text:

              service_block = '''
          <service
              android:name=".RedMusicMediaService"
              android:exported="true"
              android:foregroundServiceType="mediaPlayback">
              <intent-filter>
                  <action android:name="androidx.media3.session.MediaSessionService" />
              </intent-filter>
          </service>
          '''

              text = text.replace(
                  "</application>",
                  service_block + "\n    </application>",
                  1
              )

          p.write_text(text)

          print("AndroidManifest.xml проверен.")
          PY

      - name: Сгенерировать иконку Red Music для Android
        run: npx capacitor-assets generate --android

      - name: Синхронизировать Capacitor
        run: npx cap sync android

      - name: Проверить Android Gradle Wrapper
        run: |
          if [ ! -f android/gradlew ]; then
            echo "ОШИБКА: android/gradlew не найден!"
            exit 1
          fi

          chmod +x android/gradlew

          echo "Gradle Wrapper найден."
          android/gradlew --version

      - name: Проверить Render
        run: |
          curl --fail --silent --show-error \
            https://red-music.onrender.com/health

          echo

          curl --fail --silent --show-error \
            https://red-music.onrender.com/api/music/public-health

          echo

      - name: Собрать APK
        run: |
          chmod +x android/gradlew

          cd android

          ./gradlew clean --no-daemon

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Проверить APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ОШИБКА: APK не найден!"

            find android/app/build \
              -type f \
              | sort \
              | head -200 || true

            exit 1
          fi

          echo "===================================="
          echo "APK УСПЕШНО СОЗДАН!"
          echo "===================================="

          ls -lh "$APK"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
