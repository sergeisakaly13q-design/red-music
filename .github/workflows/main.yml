name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Проверить проект
        run: |
          echo "Содержимое проекта:"
          ls -la

      - name: Создать package-lock если его нет
        run: |
          if [ ! -f package.json ]; then
            echo "ОШИБКА: package.json не найден!"
            exit 1
          fi

          if [ ! -f package-lock.json ]; then
            echo "package-lock.json отсутствует. Создаём..."
            npm install --package-lock-only
          fi

      - name: Установить зависимости проекта
        run: npm install

      - name: Установить Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Создать конфигурацию Capacitor
        env:
          RED_MUSIC_SERVER_URL: ${{ vars.RED_MUSIC_SERVER_URL }}
        run: |
          SERVER_URL="${RED_MUSIC_SERVER_URL:-https://red-music.onrender.com}"

          cat > capacitor.config.json <<EOF
          {
            "appId": "com.redmusic.app",
            "appName": "Red Music",
            "webDir": "public",
            "server": {
              "url": "${SERVER_URL}",
              "cleartext": false
            }
          }
          EOF

          cat capacitor.config.json

      - name: Подготовить Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Установить генератор иконки
        run: npm install @capacitor/assets --no-save

      - name: Проверить иконку
        run: |
          if [ -f assets/icon.png ]; then
            echo "Найдена assets/icon.png"
          elif [ -f assets/icon-only.png ]; then
            echo "Найдена assets/icon-only.png"
          else
            echo "Иконка не найдена. Используется стандартная иконка."
          fi

      - name: Сгенерировать иконку Red Music
        run: |
          if [ -f assets/icon.png ] || [ -f assets/icon-only.png ]; then
            npx capacitor-assets generate --android
          else
            echo "Пропускаем генерацию иконки"
          fi

      - name: Синхронизировать Capacitor
        run: npx cap sync android

      - name: Собрать APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
