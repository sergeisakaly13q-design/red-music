name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Проверить Node и NPM
        run: |
          node --version
          npm --version

      - name: Проверить package.json
        run: |
          if [ ! -f package.json ]; then
            echo "ОШИБКА: package.json не найден"
            exit 1
          fi

          echo "package.json найден"
          cat package.json

      - name: Установить зависимости
        run: |
          npm install --no-audit --no-fund

      - name: Проверить Capacitor
        run: |
          npx cap --version

      - name: Создать конфигурацию Capacitor
        run: |
          node <<'NODE'
          const fs = require("fs");

          const config = {
            appId: "com.redmusic.app",
            appName: "Red Music",
            webDir: "public",
            server: {
              url: "https://red-music.onrender.com",
              cleartext: false,
              androidScheme: "https",
              allowNavigation: [
                "red-music.onrender.com",
                "*.onrender.com"
              ]
            }
          };

          fs.writeFileSync(
            "capacitor.config.json",
            JSON.stringify(config, null, 2) + "\n"
          );

          console.log("Capacitor config создан");
          NODE

      - name: Проверить Android
        run: |
          if [ -d android ]; then
            echo "Android проект найден"
          else
            echo "Android проекта нет. Создаём..."
            npx cap add android
          fi

      - name: Синхронизировать Capacitor
        run: |
          npx cap sync android

      - name: Проверить Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --version

      - name: Собрать APK
        run: |
          chmod +x android/gradlew

          cd android

          ./gradlew clean \
            --no-daemon \
            --stacktrace

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Проверить APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ОШИБКА: APK не найден"
            find android/app/build -type f | head -100 || true
            exit 1
          fi

          echo "APK успешно создан:"
          ls -lh "$APK"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
