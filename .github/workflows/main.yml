name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 1

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Проверить окружение
        run: |
          echo "===== NODE ====="
          node --version

          echo "===== NPM ====="
          npm --version

          echo "===== JAVA ====="
          java -version

          echo "===== PROJECT ====="
          pwd
          ls -la

      - name: Проверить package.json
        run: |
          if [ ! -f package.json ]; then
            echo "ОШИБКА: package.json не найден!"
            exit 1
          fi

          echo "package.json найден"
          cat package.json

      - name: Проверить public
        run: |
          if [ ! -d public ]; then
            echo "ОШИБКА: папка public не найдена!"
            exit 1
          fi

          echo "Папка public найдена"
          find public -maxdepth 2 -type f | head -100

      - name: Проверить Android
        run: |
          if [ -d android ]; then
            echo "Android проект найден в репозитории"
            find android -maxdepth 2 -type f | head -100
          else
            echo "Android проекта нет. Он будет создан Capacitor."
          fi

      - name: Установить зависимости
        run: |
          npm install --no-audit --no-fund

      - name: Проверить Capacitor
        run: |
          npx cap --version
          npx cap doctor || true

      - name: Создать конфигурацию Capacitor
        run: |
          node <<'NODE'
          const fs = require("fs");

          const config = {
            appId: "com.redmusic.app",
            appName: "Red Music",
            webDir: "public",
            server: {
              url: "https://red-music.onrender.com",
              cleartext: false,
              androidScheme: "https",
              allowNavigation: [
                "red-music.onrender.com",
                "*.onrender.com"
              ]
            }
          };

          fs.writeFileSync(
            "capacitor.config.json",
            JSON.stringify(config, null, 2) + "\n"
          );

          console.log("capacitor.config.json успешно создан:");
          console.log(JSON.stringify(config, null, 2));
          NODE

      - name: Добавить Android платформу если её нет
        run: |
          # Проверяем не саму папку android, а наличие в ней gradlew.
          # Если папка android есть, но неполная (например, закоммичена
          # без gradle wrapper), пересоздаём её полностью через Capacitor.
          if [ ! -f android/gradlew ]; then
            if [ -d android ]; then
              echo "Папка android существует, но она неполная (нет gradlew)."
              echo "Удаляем и пересоздаём Android платформу..."
              rm -rf android
            else
              echo "Android проекта нет."
              echo "Создаём Android платформу..."
            fi

            npx cap add android
          else
            echo "Android проект уже существует и содержит gradlew."
            echo "Используем существующий Android проект."
          fi

      - name: Проверить Android Gradle Wrapper
        run: |
          if [ ! -f android/gradlew ]; then
            echo "ОШИБКА: android/gradlew не найден!"
            find android -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          chmod +x android/gradlew

          echo "Gradle Wrapper найден."

      - name: Синхронизировать Capacitor
        run: |
          npx cap sync android

      - name: Проверить Android после Capacitor sync
        run: |
          echo "===== ANDROID STRUCTURE ====="
          find android -maxdepth 3 -type f | sort | head -200

          echo "===== GRADLE VERSION ====="
          chmod +x android/gradlew
          cd android
          ./gradlew --version

      - name: Собрать APK
        run: |
          chmod +x android/gradlew

          cd android

          echo "===== CLEAN ====="
          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo "===== BUILD DEBUG APK ====="
          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Проверить APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ОШИБКА: APK не найден!"
            echo ""
            echo "Доступные файлы:"
            find android/app/build -type f | sort | head -200 || true
            exit 1
          fi

          echo "================================"
          echo "APK УСПЕШНО СОЗДАН!"
          echo "================================"

          ls -lh "$APK"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
