name: Build Red Music APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Скачать проект
      # ==========================================
      - name: Скачать проект
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 1

      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 3. Node.js 20
      # ВАЖНО: cache НЕ используем,
      # потому что package-lock.json отсутствует
      # ==========================================
      - name: Установить Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      # ==========================================
      # 4. Проверка проекта
      # ==========================================
      - name: Проверить проект
        run: |
          echo "===================================="
          echo "ПРОВЕРКА ПРОЕКТА"
          echo "===================================="

          if [ ! -d "android" ]; then
            echo "ОШИБКА: папка android отсутствует!"
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ОШИБКА: android/gradlew отсутствует!"
            exit 1
          fi

          if [ ! -f "android/app/build.gradle" ]; then
            echo "ОШИБКА: android/app/build.gradle отсутствует!"
            exit 1
          fi

          if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
            echo "ОШИБКА: AndroidManifest.xml отсутствует!"
            exit 1
          fi

          if [ ! -f "package.json" ]; then
            echo "ОШИБКА: package.json отсутствует!"
            exit 1
          fi

          echo "Проект найден."
          echo "Android-проект найден."
          echo "package.json найден."

      # ==========================================
      # 5. Проверка Media3 файлов
      # ==========================================
      - name: Проверить Media3 файлы
        run: |
          echo "===================================="
          echo "ПРОВЕРКА MEDIA3"
          echo "===================================="

          find android/app/src/main -type f \
            \( -name "MainActivity.kt" \
            -o -name "RedMusicMediaPlugin.kt" \
            -o -name "RedMusicMediaService.kt" \) \
            -print

          if [ ! -f "android/app/src/main/java/com/redmusic/app/RedMusicMediaService.kt" ]; then
            echo "ОШИБКА: RedMusicMediaService.kt не найден!"
            exit 1
          fi

          if [ ! -f "android/app/src/main/java/com/redmusic/app/RedMusicMediaPlugin.kt" ]; then
            echo "ОШИБКА: RedMusicMediaPlugin.kt не найден!"
            exit 1
          fi

          if [ ! -f "android/app/src/main/java/com/redmusic/app/MainActivity.kt" ]; then
            echo "ОШИБКА: MainActivity.kt не найден!"
            exit 1
          fi

          echo "Media3 файлы найдены."

      # ==========================================
      # 6. Проверка аудио
      # ==========================================
      - name: Проверить большие аудиофайлы
        run: |
          echo "Аудиофайлы проекта:"

          find . -type f \
            \( -iname "*.mp3" \
            -o -iname "*.wav" \
            -o -iname "*.ogg" \
            -o -iname "*.m4a" \
            -o -iname "*.flac" \) \
            -not -path "./node_modules/*" \
            -not -path "./.git/*" \
            | head -100 || true

      # ==========================================
      # 7. Установить npm зависимости
      # ==========================================
      - name: Установить зависимости
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps

      # ==========================================
      # 8. Установить Capacitor Assets
      # ==========================================
      - name: Установить генератор иконок
        run: |
          npm install @capacitor/assets --no-save --legacy-peer-deps

      # ==========================================
      # 9. Проверить Media3 зависимости
      # ==========================================
      - name: Проверить Media3 зависимости
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")

          if not p.exists():
              raise SystemExit(
                  "ОШИБКА: android/app/build.gradle не найден!"
              )

          text = p.read_text()

          media3_version = "1.10.1"

          # Удаляем старую androidx.media
          text = re.sub(
              r'^\s*implementation\s+[\'"]androidx\.media:media:[^\'"]+[\'"]\s*$',
              '',
              text,
              flags=re.MULTILINE
          )

          exoplayer = (
              f'implementation "androidx.media3:media3-exoplayer:{media3_version}"'
          )

          session = (
              f'implementation "androidx.media3:media3-session:{media3_version}"'
          )

          if "androidx.media3:media3-exoplayer" not in text:

              match = re.search(r'dependencies\s*\{', text)

              if match:
                  insert_pos = match.end()

                  additions = (
                      f"\n    {exoplayer}\n"
                      f"    {session}\n"
                  )

                  text = (
                      text[:insert_pos]
                      + additions
                      + text[insert_pos:]
                  )

              else:
                  text += (
                      "\n\ndependencies {\n"
                      f"    {exoplayer}\n"
                      f"    {session}\n"
                      "}\n"
                  )

          p.write_text(text)

          print("Media3 зависимости проверены.")
          print(f"Media3 версия: {media3_version}")
          PY

      # ==========================================
      # 10. Проверить AndroidManifest
      # ==========================================
      - name: Проверить AndroidManifest для Media3
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")

          if not p.exists():
              raise SystemExit(
                  "ОШИБКА: AndroidManifest.xml не найден!"
              )

          text = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />'
          ]

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      "</manifest>",
                      f"    {permission}\n</manifest>",
                      1
                  )

          service_name = 'android:name=".RedMusicMediaService"'

          if service_name not in text:

              service_block = '''
          <service
              android:name=".RedMusicMediaService"
              android:exported="true"
              android:foregroundServiceType="mediaPlayback">
              <intent-filter>
                  <action android:name="androidx.media3.session.MediaSessionService" />
              </intent-filter>
          </service>
          '''

              text = text.replace(
                  "</application>",
                  service_block + "\n    </application>",
                  1
              )

          p.write_text(text)

          print("AndroidManifest.xml проверен.")
          PY

      # ==========================================
      # 11. Генерация иконок
      # ==========================================
      - name: Сгенерировать иконку Red Music для Android
        run: |
          npx capacitor-assets generate --android

      # ==========================================
      # 12. Capacitor sync
      # ==========================================
      - name: Синхронизировать Capacitor
        run: |
          npx cap sync android

      # ==========================================
      # 13. Проверка Gradle Wrapper
      # ==========================================
      - name: Проверить Android Gradle Wrapper
        run: |
          echo "===================================="
          echo "ПРОВЕРКА GRADLE WRAPPER"
          echo "===================================="

          if [ ! -f "android/gradlew" ]; then
            echo "ОШИБКА: android/gradlew не найден!"
            exit 1
          fi

          if [ ! -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ОШИБКА: gradle-wrapper.properties не найден!"
            exit 1
          fi

          chmod +x android/gradlew

          echo "Gradle Wrapper найден."
          echo
          echo "Версия Gradle:"
          cd android
          ./gradlew --version

      # ==========================================
      # 14. Проверка Render
      # ==========================================
      - name: Проверить Render
        run: |
          echo "Проверяем сервер Red Music..."

          curl --fail --silent --show-error \
            --max-time 30 \
            https://red-music.onrender.com/health

          echo

          curl --fail --silent --show-error \
            --max-time 30 \
            https://red-music.onrender.com/api/music/public-health

          echo

      # ==========================================
      # 15. Сборка APK
      # ==========================================
      - name: Собрать APK
        run: |
          chmod +x android/gradlew

          cd android

          echo "===================================="
          echo "ОЧИСТКА GRADLE"
          echo "===================================="

          ./gradlew clean --no-daemon

          echo "===================================="
          echo "СБОРКА DEBUG APK"
          echo "===================================="

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # ==========================================
      # 16. Проверить APK
      # ==========================================
      - name: Проверить APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ОШИБКА: APK не найден!"

            echo "Содержимое build:"
            find android/app/build \
              -type f \
              | sort \
              | head -200 || true

            exit 1
          fi

          echo "===================================="
          echo "APK УСПЕШНО СОЗДАН!"
          echo "===================================="

          ls -lh "$APK"

      # ==========================================
      # 17. Загрузить APK
      # ==========================================
      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
