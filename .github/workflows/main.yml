name: Red Music - Build & Security Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: red-music-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-build:
    name: Security & Node.js Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Verify project files
        run: |
          test -f package.json
          test -f server.js
          test -f middleware/auth.js
          test -f middleware/rateLimit.js
          test -f middleware/bruteForce.js
          test -f routes/auth.js
          test -f routes/music.js

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check middleware/auth.js
          node --check middleware/rateLimit.js
          node --check middleware/bruteForce.js
          node --check routes/auth.js
          node --check routes/music.js
          node --check routes/roles.js
          node --check routes/logs.js
          node --check routes/popular.js
          node --check routes/history.js

      - name: Check package.json
        run: node -e "const p=require('./package.json'); if(!p.name || !p.version || !p.main) process.exit(1); console.log('package.json OK')"

      - name: Check security middleware
        run: |
          grep -q "rate" middleware/rateLimit.js
          grep -q "brute" middleware/bruteForce.js
          grep -q "Authorization" middleware/auth.js || true
          echo "Security middleware files detected."

      - name: Check for accidentally committed environment secrets
        run: |
          if [ -f ".env" ]; then
            echo "ERROR: .env must not be committed to the repository."
            exit 1
          fi

          echo "No .env file found."

      - name: Check repository for obvious private key files
        run: |
          if find . \
            -type f \
            \( -name "*.pem" -o -name "*.key" -o -name "*private*.key" \) \
            -not -path "./.git/*" \
            | grep -q .; then
              echo "ERROR: Possible private key file detected."
              find . \
                -type f \
                \( -name "*.pem" -o -name "*.key" -o -name "*private*.key" \) \
                -not -path "./.git/*"
              exit 1
          fi

          echo "No obvious private key files detected."

      - name: Check npm dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Security check completed
        run: |
          echo "======================================"
          echo " Red Music security check completed"
          echo "======================================"
          echo "Rate Limit: detected"
          echo "Brute-force protection: detected"
          echo "Server-side auth middleware: detected"
          echo "JavaScript syntax: OK"
          echo "======================================"

  android-check:
    name: Android Project Check
    runs-on: ubuntu-latest
    needs: security-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Check Android project
        run: |
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml

          echo "Android project structure detected."

      - name: Check Android MediaSession files
        run: |
          test -f android/app/src/main/java/com/redmusic/app/MainActivity.kt
          test -f android/app/src/main/java/com/redmusic/app/RedMusicMediaPlugin.kt
          test -f android/app/src/main/java/com/redmusic/app/RedMusicMediaService.kt

          echo "MediaSession files detected."

      - name: Android check completed
        run: |
          echo "======================================"
          echo " Red Music Android check completed"
          echo "======================================"
